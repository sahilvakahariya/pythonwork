<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f5f5;
        }
        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,.1);
        }
        .card-header{
            background:#0d6efd;
            color:white;
            font-size:24px;
            font-weight:bold;
            text-align:center;
            border-radius:15px 15px 0 0 !important;
        }
        .btn{
            width:100%;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card">
                <div class="card-header">
                    Product Form
                </div>

                <div class="card-body">
                    <span class="btn btn-success">{{msg}}</span>
                    <form method="POST" action="{%url 'create'%}">
                        {%csrf_token%}
                        <input type="hidden" name="id" value="{{products.id}}">

                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" class="form-control" placeholder="Enter Product Name" name="name" value="{{products.name}}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Price</label>
                            <input type="number" class="form-control" placeholder="Enter Price" name="price" value="{{products.price}}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Quantity</label>
                            <input type="number" class="form-control" placeholder="Enter Quantity" name="qty" value="{{products.qty}}">
                        </div>

                        {% if product %}
                <button type="submit" class="btn btn-primary w-100 mb-2">
                         UPDATE STUDENT
                </button>

                        {% else %}
                <button type="submit" class="btn btn-success w-100 mb-2">
                    SAVE STUDENT
                 </button>
                {% endif %}

                <button type="reset" class="btn btn-secondary w-100">
    RESET
                </button>
                           
                <br><br>
                <a href="{% url 'display' %}" type="submit" class="btn-success">DISPLAY RECORDS</a>
                         </div>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
