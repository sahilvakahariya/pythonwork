<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="text-center">Product List</h3>
        </div>

        <div class="card-body">

            <a href="{% url 'create' %}" class="btn btn-success mb-3">
                Add Product
            </a>

            <table class="table table-bordered table-hover text-center">
                <thead class="table-dark">
                    <tr>
                        <th>SR.NO</th>
                        <th>ID</th>
                        <th>Product Name</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th colspan="2">action</th>
                    </tr>
                </thead>

                <tbody>

                {% for product in products %}
                <tr>
                    <td>{{forloop.counter}}</td>
                    <td>{{ product.id }}</td>
                    <td>{{ product.name }}</td>
                    <td>₹ {{ product.price }}</td>
                    <td>{{ product.qty }}</td>
                    <td><a href="{%url 'delete'%}?id={{product.id}}" class="btn btn-danger">delete</a></td>
                    <td><a href="{%url 'update'%}?id={{product.id}}" class="btn btn-success">update</a></td>
                </tr>

                {% endfor %}

                </tbody>
            </table>
            <a href="{%url 'index'%}" class="btn btn-success">ADD PRODUCT</a>

        </div>
    </div>

</div>

</body>
</html>
