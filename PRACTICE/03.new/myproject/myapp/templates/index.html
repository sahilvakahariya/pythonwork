<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: #f4f6f9;
        }

        .form-container{
            max-width: 500px;
            margin: 60px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        h2{
            text-align: center;
            margin-bottom: 25px;
            color: #0d6efd;
        }

        .btn-custom{
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container">

        <h2>Employee Form</h2>
        <span class="text-success">{{msg}}</span>

         <form method="post" action="{% url 'create' %}">
             {% csrf_token %}
            <div class="mb-3">
                <label class="form-label"> ID</label>
                <input type="number" class="form-control" name="id" placeholder="Enter Employee ID" name="id" value="{{employees.id}}">
            </div>

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" name="name" placeholder="Enter Employee Name" name="name" value="{{employees.name}}">
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="tel" class="form-control" name="phone" placeholder="Enter Phone Number" name="phone number" value="{{employees.phone}}">
            </div>

            <div class="mb-3">
                <label class="form-label">Salary</label>
                <input type="number" class="form-control" name="salary" placeholder="Enter Salary" name="salary" value="{{employees.salary}}">
            </div>

            
            {%if employees%}
            <button type="submit" class="btn btn-primary w-100">
            UPDATE EMPLOYEES
            </button>

            {%else%}
            <button type="submit" class="btn btn-primary w-100">
            SAVE EMPLOYEES
            </button>
            {%endif%}

             <button type="submit" class="btn btn-primary w-100">
                reset
            </button>
    
            <a href="{%url 'display'%}" class="btn btn-info">DISPLAY EMPLOYEE</a>


        </form>
    </div>
</div>

</body>
</html>
