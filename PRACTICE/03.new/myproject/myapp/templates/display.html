<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees Records</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="text-center text-primary mb-4">Employee Records</h2>

    <table class="table table-bordered table-hover table-striped text-center">
        <thead class="table-dark">
            <tr>
                <th>srno</th>
                <th>id</th>
                <th>Name</th>
                <th>phone</th>
                <th>salary</th>
                <th colspan="2">action</th>
            </tr>
        </thead>

        <tbody>
            {% for employee in employees %}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{ employee.id }}</td>
                <td>{{ employee.name }}</td>
                <td>{{ employee.phone }}</td>
                <td>{{ employee.salary }}</td>
                <td><a href="{%url 'delete'%}?id={{employee.id}}" class="btn btn-danger">delete</a></td>
                <td><a href="{%url 'retrive'%}?id={{employee.id}}" class="btn btn-primary">update</a></td>
            </tr>
         
            {% endfor %}
        </tbody>
    </table>
    <a href="{%url 'index'%}" class="btn btn-success">ADD EMPLOYEES</a>
</div>

</body>
</html>
