{% extends "base.html" %}

{% block title %}
Verifying Payment | 7 Cricket Zone
{% endblock %}

{% block content %}

<style>

.waiting-page {

    min-height: 85vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 30px;

    background:
        radial-gradient(
            circle,
            rgba(25,135,84,.20),
            transparent 40%
        ),
        #020906;

}


.waiting-card {

    max-width: 550px;

    width: 100%;

    padding: 45px 30px;

    text-align: center;

    border-radius: 28px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid
        rgba(255,255,255,.10);

}


.loader {

    width: 60px;

    height: 60px;

    margin:
        0 auto 25px;

    border-radius: 50%;

    border:
        5px solid
        rgba(255,255,255,.10);

    border-top-color:
        #ffc107;

    animation:
        spin 1s linear infinite;

}


@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


.waiting-card h1 {

    color: white;

    font-weight: 900;

}


.waiting-card p {

    color:
        rgba(255,255,255,.55);

    line-height: 1.7;

}


.error-message {

    display: none;

    margin-top: 20px;

    color: #ff6b6b;

}

</style>


<section class="waiting-page">

    <div class="waiting-card">

        <div class="loader"></div>


        <h1>

            Verifying Payment...

        </h1>


        <p>

            Please wait while we confirm
            your payment.

        </p>


        <p>

            Booking #{{ booking.id }}

        </p>


        <p
            id="errorMessage"
            class="error-message"
        >

            Payment could not be confirmed.

        </p>

    </div>

</section>


<script>

const bookingId =
    "{{ booking.id }}";


const orderId =
    "{{ order_id }}";


let attempts = 0;


function checkPayment() {

    attempts++;


    fetch(
        `/payment-status/${bookingId}/?order_id=${encodeURIComponent(orderId)}`
    )

    .then(
        response => response.json()
    )

    .then(
        data => {

            console.log(
                "Payment status:",
                data
            );


            if (
                data.status
                === "Success"
            ) {

                window.location.href =
                    data.redirect;

                return;

            }


            if (
                data.status
                === "Failed"
            ) {

                document
                    .getElementById(
                        "errorMessage"
                    )
                    .style.display =
                        "block";

                document
                    .getElementById(
                        "errorMessage"
                    )
                    .innerText =
                        "Payment failed. Please try again.";

                return;

            }


            // Keep checking

            if (attempts < 30) {

                setTimeout(
                    checkPayment,
                    2000
                );

            }

        }
    )

    .catch(
        error => {

            console.log(
                error
            );


            if (attempts < 30) {

                setTimeout(
                    checkPayment,
                    3000
                );

            }

        }
    );

}


checkPayment();

</script>

{% endblock %}
