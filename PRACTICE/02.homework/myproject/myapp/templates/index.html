<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: #f4f6f9;
        }

        .form-box{
            width: 450px;
            margin: 70px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#0d6efd;
            font-weight:bold;
        }

        .btn-custom{
            width:100%;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-box">

        <h2>Student Form</h2>
        <span>SIMPLE REGISTRATION FORM</span>

        <form method="POST" action="{%url 'create' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Student Name</label>
                <input type="text" class="form-control" name="name" placeholder="Enter Name" name="name">
            </div>

            <div class="mb-3">
                <label class="form-label">Roll Number</label>
                <input type="number" class="form-control" name="rollno" placeholder="Enter Roll Number" name="rollno">
            </div>

            <div class="mb-3">
                <label class="form-label">Marks</label>
                <input type="number" class="form-control" name="marks" placeholder="Enter Marks" name="marks">
            </div>

            <button type="submit" class="btn btn-primary btn-custom">
                Submit
            </button>

        </form>

    </div>
</div>

</body>
</html>
