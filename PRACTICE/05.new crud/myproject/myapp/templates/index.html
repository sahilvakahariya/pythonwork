<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: #f4f6f9;
        }

        .card{
            max-width: 500px;
            margin: 60px auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        h2{
            text-align: center;
            color: #0d6efd;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card p-4">
       <h2>Registration Form</h2> 
       <span class="text-success">{{ msg }}</span>
        <form method="post" action="{% url 'create' %}">
            {% csrf_token %}
            <input type="hidden" name="id" value="{{students.id}}">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control" placeholder="Enter Name" required value="{{students.name}}">
            </div>

            <div class="mb-3">
                <label class="form-label">Age</label>
                <input type="number" name="age" class="form-control" placeholder="Enter Age" required value="{{students.age}}">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="Enter Email" required value="{{students.email}}">
            </div>

             {%if student%}
            <button type="submit" class="btn btn-primary w-100">
            UPDATE STUDENT
            </button>

            {%else%}
            <button type="submit" class="btn btn-primary w-100">
            SAVE STUDENT
            </button>
            {%endif%}

             <button type="submit" class="btn btn-primary w-100">
                reset
            </button>

            <div class="text-center mt-3">
                <a href="{% url 'display' %}" class="btn btn-success">DISPLAY RECORDS</a>
            </div>

        </form>

    </div>
</div>

</body>
</html>
