<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Display</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f5f5f5;
        }

        .container{
            margin-top:50px;
        }

        .card{
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
            color:#0d6efd;
            font-weight:bold;
        }

        table{
            text-align:center;
        }

        .btn{
            width:80px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="card p-4">

        <h2>Student Records</h2>

        <div class="text-end mb-3">
            <a href="#" class="btn btn-success">Add Student</a>
        </div>

        <table class="table table-bordered table-hover table-striped">
            <thead class="table-dark">
                <tr>
                    <th>SRNO</th>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Email</th>
                    <th colspan="2">Action</th>
                </tr>
            </thead>
            {% for student in students %} //zinza code use 
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.age }}</td>
                <td>{{ student.email }}</td>
                <td><a href="{%url 'delete'%}?id={{student.id}}" class="btn btn-danger">delete</a></td>
                <td><a href="{%url 'update'%}?id={{student.id}}" class="btn btn-primary">update</a></td>
            </tr>
         
            {% endfor %}

        </table>
        <a href="{%url 'index'%}" class="btn btn-secondary">ADD STUDENT</a>

    </div>

</div>

</body>
</html>
