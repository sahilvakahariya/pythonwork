<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Form</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(to right,#00c6ff,#0072ff);
            font-family: Arial, Helvetica, sans-serif;
        }

        .book-form{
            width:500px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 20px black;
        }

        h2{
            color:darkblue;
            text-align:center;
            font-weight:bold;
        }

        label{
            font-weight:bold;
            color:darkred;
        }

        .form-control{
            border:2px solid #0d6efd;
            border-radius:8px;
        }

        .form-control:focus{
            border-color:green;
            box-shadow:0 0 8px green;
        }

        .btn-primary{
            width:100%;
            font-size:20px;
            font-weight:bold;
            background:green;
            border:none;
        }

        .btn-primary:hover{
            background:darkgreen;
        }

        marquee{
            background:yellow;
            color:red;
            font-size:28px;
            font-weight:bold;
            padding:10px;
            margin-bottom:20px;
        }
    </style>
</head>
<body>

<marquee behavior="scroll" direction="left">
📚 Welcome to Book Management System 📚
</marquee>

<div class="container">
    <div class="book-form">

        <h2>Book Registration Form</h2>
        

           <form method="post" action="{% url 'create' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label>ID</label>
                <input type="number" class="form-control" name="id" placeholder="Enter Book ID" name="id">
            </div>

            <div class="mb-3">
                <label>Title</label>
                <input type="text" class="form-control" name="title" placeholder="Enter Book Title" name="title">
            </div>

            <div class="mb-3">
                <label>author</label>
                <input type="text" class="form-control" name="author" placeholder="Enter Author Name" name="author">
            </div>

            <div class="mb-3">
                <label>Price</label>
                <input type="number" class="form-control" name="price" placeholder="Enter Book Price" name="price">
            </div>

            <button type="submit" class="btn btn-primary">
                Save Book
            </button>
        </form>
        
        <span class="text-success">{{msg}}</span>

    </div>
</div>

</body>
</html>
