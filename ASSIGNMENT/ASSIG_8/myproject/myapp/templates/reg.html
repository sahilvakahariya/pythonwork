<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg,#4e73df,#1cc88a);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            border:none;
            border-radius:15px;
        }

        .card-header{
            background:#198754;
            color:#fff;
            border-radius:15px 15px 0 0 !important;
        }

        .form-control{
            border-radius:10px;
        }

        .btn-success{
            border-radius:10px;
            font-weight:bold;
        }

        .logo{
            font-size:45px;
        }

        a{
            text-decoration:none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-lg">

                <div class="card-header text-center py-3">
                    <div class="logo">📝</div>
                    <h3>Create Account</h3>
                </div>

                <div class="card-body p-4">

                    {% if success %}
                    <div class="alert alert-success text-center">
                        {{ success }}
                    </div>
                    {% endif %}

                    {% if err %}
                    <div class="alert alert-danger text-center">
                        {{ err }}
                    </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">
                                    First Name
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    name="first_name"
                                    placeholder="Enter First Name"
                                    required
                                >
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">
                                    Last Name
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    name="last_name"
                                    placeholder="Enter Last Name"
                                    required
                                >
                            </div>

                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Username
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                name="username"
                                placeholder="Enter Username"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Password
                            </label>
                            <input
                                type="password"
                                class="form-control"
                                name="password"
                                placeholder="Enter Password"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Register
                        </button>

                    </form>

                    <div class="text-center mt-4">
                        Already have an account?
                        <a href="{% url 'index' %}" class="fw-bold">
                            Login Here
                        </a>
                    </div>

                </div>

            </div>

        </div>
    </div>
</div>

</body>
</html>
