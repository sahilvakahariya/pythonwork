<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg,#4e73df,#1cc88a);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            border:none;
            border-radius:15px;
        }

        .card-header{
            background:#0d6efd;
            color:white;
            border-radius:15px 15px 0 0 !important;
        }

        .btn-primary{
            border-radius:10px;
        }

        .form-control{
            border-radius:10px;
        }

        .logo{
            font-size:45px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card shadow-lg">

                <div class="card-header text-center py-3">
                    <div class="logo">🔐</div>
                    <h3>Login</h3>
                </div>

                <div class="card-body p-4">

                    {% if err %}
                    <div class="alert alert-danger text-center">
                        {{ err }}
                    </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Username
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                name="username"
                                placeholder="Enter Username"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Password
                            </label>
                            <input
                                type="password"
                                class="form-control"
                                name="password"
                                placeholder="Enter Password"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Login
                        </button>

                    </form>

                    <div class="text-center mt-3">
                        <small>
                            Don't have an account?
                            <a href="{% url 'reg' %}" class="text-decoration-none fw-bold">
                                Register Here
                            </a>
                        </small>
                    </div>

                </div>

            </div>

        </div>
    </div>
</div>

</body>
</html>
