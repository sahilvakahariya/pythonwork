<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Profile App</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body{
            background:#f5f7fb;
        }

        .navbar{
            background:linear-gradient(90deg,#0d6efd,#6610f2);
        }

        .navbar-brand,
        .nav-link{
            color:white !important;
            font-weight:500;
        }

        .nav-link:hover{
            color:#ffd43b !important;
        }

        .content-box{
            background:white;
            border-radius:15px;
            padding:30px;
            margin-top:30px;
            box-shadow:0 0 20px rgba(0,0,0,.1);
        }

        footer{
            margin-top:40px;
            background:#212529;
            color:white;
            padding:15px;
            text-align:center;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow">
        <div class="container">

            <a class="navbar-brand" href="{% url 'profile_list' %}">
                <i class="bi bi-people-fill"></i>
                Social Profile
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'profile_list' %}">
                            <i class="bi bi-house-fill"></i>
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'profile_create' %}">
                            <i class="bi bi-person-plus-fill"></i>
                            Add Profile
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'profile_export' %}">
                            <i class="bi bi-download"></i>
                            Export CSV
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">

        <div class="content-box">

            {% block content %}
            {% endblock %}

        </div>

    </div>

    <!-- Footer -->
    <footer>
        <p class="mb-0">
            © 2026 Social Profile App | Developed with ❤️ using Django & Bootstrap 5
        </p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
