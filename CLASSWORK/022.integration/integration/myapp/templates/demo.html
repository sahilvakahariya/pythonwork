<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
    <style>
        table {
            width: 60%;
            border-collapse: collapse;
            margin: 30px auto;
        }

        table, th, td {
            border: 2px solid black;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Course</th>
            <th>City</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Sahil Patel</td>
            <td>BCA</td>
            <td>Surat</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Raj Patel</td>
            <td>B.Com</td>
            <td>Ahmedabad</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Neel Shah</td>
            <td>B.Sc</td>
            <td>Vadodara</td>
        </tr>
    </table>

</body>
</html>
