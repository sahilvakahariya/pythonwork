<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f5f5f5;
        }
        .form-box{
            width:450px;
            margin:60px auto;
            background:#fff;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }
        h2{
            text-align:center;
            margin-bottom:20px;
        }
    </style>
</head>
<body>

<div class="form-box">
    <h2>Product Form</h2>

    <form action="{%url 'create'%}" method="post" enctype="multipart/form-data">
        {%csrf_token%}
        <input type="hidden" name="id" value="{{products.id}}">
        <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input type="text" name="name" class="form-control" placeholder="Enter Product Name" value="{{products.id}}">
        </div>

        <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="number" name="price" class="form-control" placeholder="Enter Price" value="{{products.price}}">
        </div>

        <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input type="number" name="qty" class="form-control" placeholder="Enter Quantity" value="{{products.qty}}">
        </div>

         <div class="mb-3">
            <label class="form-label">image</label>
            <input type="file" class="form-control" name="image">
        </div>


        <div class="mb-3">
            <label class="form-label">Category</label>
            <select name="cat" class="form-select" required>
                <option selected disabled>select category</option>
                {%for cat in categories%}
                <option value="{{cat.id}}"> {{cat.name}} </option>
                {%endfor%}
            </select>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary">
                register product
            </button>
            <a href="{%url 'display'%}" class="btn btn-secondary">
                display
            </a>
        </div>

    </form>
</div>

</body>
</html>
