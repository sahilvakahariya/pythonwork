<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f4f4;
        }

        .form-container {
            max-width: 500px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container">
        <h2>Registration Form</h2> 
       <span>{{ msg }}</span>
        <form method="post" action="{% url 'create' %}">
            {% csrf_token %}
            <input type="hidden" name="id" value="{{student.id}}">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" placeholder="Enter your name" required name="name" value="{{student.name}}">
            </div>

            <div class="mb-3">
                <label class="form-label">Roll No</label>
                <input type="number" class="form-control" placeholder="Enter your roll number" required name="rollno" value="{{student.rollno}}">
            </div>
+
            <div class="mb-3">
                <label class="form-label">Marks</label>
                <input type="number" class="form-control" placeholder="Enter your marks" min="1" max="100" required name="marks" value="{{student.marks}}">
            </div>
            {% if student %}
                <button type="submit" class="btn btn-primary w-100 mb-2">
    UPDATE STUDENT
                </button>
            {% else %}
                <button type="submit" class="btn btn-success w-100 mb-2">
    SAVE STUDENT
        </button>
    {% endif %}

<button type="reset" class="btn btn-secondary w-100">
    RESET
</button>
           

        </form>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
