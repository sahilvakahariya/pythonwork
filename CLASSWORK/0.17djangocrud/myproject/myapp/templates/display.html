<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="text-center text-primary mb-4">Student Records</h2>

    <table class="table table-bordered table-hover table-striped text-center">
        <thead class="table-dark">
            <tr>
                <th>srno</th>
                <th>Roll No</th>
                <th>Name</th>
                <th>Marks</th>
                <th colspan="2">action</th>
            </tr>
        </thead>

        <tbody>
            {% for student1 in students %}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{ student1.name }}</td>
                <td>{{ student1.rollno }}</td>
                <td>{{ student1.marks }}</td>
                <td><a href="{%url 'delete'%}?id={{student1.id}}" class="btn btn-danger">delete</a></td>
                <td><a href="{%url 'retrive'%}?id={{student1.id}}" class="btn btn-primary">update</a></td>
            </tr>
         
            {% endfor %}
        </tbody>
    </table>
    <a href="{%url 'index'%}" class="btn btn-success">ADD STUDENT</a>
</div>

</body>
</html>
